name: Build and Deploy image private registry

on:
  push:
    branches:
      - dev

  workflow_dispatch: # Déclenchement manuel

env:
  DOCKERHUB_REGISTRY: ${{ secrets.DOCKERHUB_REGISTRY }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    steps:
      # Checkout le code de la branche
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connecter à Docker Hub
      - name: Login to technostrea Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BASE_REF=${{ secrets.BASE_REF }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_REGISTRY }}/technostrea/recettes-de-catherine-frontend:dev-latest
            ${{ env.DOCKERHUB_REGISTRY }}/technostrea/recettes-de-catherine-frontend:dev-${{ github.run_number }}
